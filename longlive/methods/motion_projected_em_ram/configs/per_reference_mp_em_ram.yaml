# Motion-Projected EM-RAM method template for per-reference adaptation.
#
# This file defines only method/backbone hyperparameters.  The protocol runner
# injects the concrete reference_video_path, train_caption, unit_id, output
# dirs, and seed for each reference unit.

data_root: ${oc.env:LL_DATA}
frame_count: 81
resolution: 480
pixel_width: 832

model_name: Wan2.1-T2V-1.3B
timestep_shift: 5.0
is_causal: true
local_attn_size: 12
sink_size: 3
base_ckpt: ${oc.env:LL_DATA}/longlive_models/models/longlive_base.pt

baseline_lora_ckpt: ${oc.env:LL_DATA}/longlive_models/models/lora.pt
baseline_adapter:
  type: lora
  rank: 256
  alpha: 256
  dropout: 0.0
  verbose: false

adapter:
  type: lora
  rank: 32
  alpha: 64
  dropout: 0.0
  verbose: false

denoising_step_list: [1000, 750, 500, 250]
warp_denoising_step: true
num_frame_per_block: 3
context_noise: 0

outer_epochs: 10
inner_steps: 16
k_rollouts: 4
k_noisings_per_endpoint: 4
g_endpoints_per_outer: 4
adv_clip_max: 5.0
t_anchors: [1000, 750, 500, 250]

em_target_kl: 0.10
em_eta: null
em_weight_clip: 4.0
em_alpha_mode: positive_excess
em_alpha_max: 1.0
em_std_floor: 1.0e-4
reward_coef: 1.0
rollout_adapter: default
beta_kl: 0.0
lambda_motion: 1.0
lambda_static: 0.05
subspace_mode: coarse_motion
motion_pool: 2
motion_temporal_center: true
reference_motion_scope: frame
reference_motion_positive: false
reference_motion_mix: 1.0
reference_motion_temporal_center: false
lambda_reference_orthogonal: 0.0

reward_n_frames: 16
reward_grid_size: 30
reward_motion_mode: tracklet_scalar
reward_bucket_count: 3
reward_moving_percentile: 60.0
reward_min_moving_tracks: 4
reward_moving_speed_floor: 1.0e-5
reward_speed_lower: 0.5
reward_speed_upper: 2.0
reward_speed_penalty_coef: 0.25
fps: 16

lr: 3.0e-4
weight_decay: 1.0e-4
warmup_steps: 0

out_dir: ${oc.env:LL_DATA}/per_reference_template_runs/mp_em_ram
cache_dir: ${oc.env:LL_DATA}/per_reference_template_runs/_tracklet_cache
scratch_dir: ${oc.env:LL_DATA}/per_reference_template_runs/_scratch/mp_em_ram
ckpt_interval: 5
ckpt_keep_last: 4

seed: 0
wandb_project: longlive_motion_projected_em_ram
wandb_entity: hongyou
