# On-policy context distillation on the 4-step DMD base.
#
# Mechanism: sample endpoints from the current student adapter, analytically
# re-noise those on-policy latents at the DMD anchors, and match a frozen
# context teacher's velocity on the visited states.
#
# For real runs, set:
#   LL_ON_POLICY_CONTEXT_DISTILLATION_TEACHER_LORA=/path/to/context_teacher_lora.pt

# ---- data ----
data_root: ${oc.env:LL_DATA}
category: Skateboarding
frame_count: 81
resolution: 480
pixel_width: 832

# ---- backbone ----
model_name: Wan2.1-T2V-1.3B
timestep_shift: 5.0
is_causal: true
local_attn_size: 12
sink_size: 3
base_ckpt: ${oc.env:LL_DATA}/longlive_models/models/longlive_base.pt

# ---- NVlabs baseline LoRA, merged into base ----
baseline_lora_ckpt: ${oc.env:LL_DATA}/longlive_models/models/lora.pt
baseline_adapter:
  type: lora
  rank: 256
  alpha: 256
  dropout: 0.0
  verbose: false

# ---- trainable student / frozen teacher adapter shape ----
adapter:
  type: lora
  rank: 32
  alpha: 64
  dropout: 0.0
  verbose: false

# ---- frozen context teacher ----
teacher_lora_ckpt: ${oc.env:LL_ON_POLICY_CONTEXT_DISTILLATION_TEACHER_LORA,}
teacher_lora_key: generator_lora
teacher_caption: ""          # empty = same caption as the student rollout
allow_base_teacher: false     # true only for smoke/no-context ablations

# ---- DMD rollout schedule ----
denoising_step_list: [1000, 750, 500, 250]
warp_denoising_step: true
num_frame_per_block: 3
context_noise: 0

# ---- on-policy distillation shape ----
outer_epochs: 20
inner_steps: 16
k_rollouts: 4
k_noisings_per_endpoint: 4
g_endpoints_per_outer: 4
t_anchors: [1000, 750, 500, 250]
distill_weight: 1.0
beta_anchor: 1.0e-3          # optional no-context base anchor
save_rollout_trajectory: false
trajectory_device: cpu

# ---- optimizer ----
lr: 3.0e-4
weight_decay: 1.0e-4
warmup_steps: 0

# ---- output ----
out_dir: ${oc.env:LL_DATA}/on_policy_context_distillation_runs/skateboarding
ckpt_interval: 5
ckpt_keep_last: 4

# ---- misc ----
seed: 0
wandb_project: longlive_on_policy_context_distillation
wandb_entity: hongyou
