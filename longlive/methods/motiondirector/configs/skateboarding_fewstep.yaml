# MotionDirector LoRA finetune on the few-step LongLive model.
#
# Frozen starting point = NVlabs LongLive complete inference product
# (longlive_base.pt + lora.pt merged), matching configs/longlive_inference.yaml.
# On top of that we attach a new LoRA trained with MotionDirector loss.
#
# Timestep sampling — anchor_only restricts MLE training to the few-step
# inference anchors so updates don't push the student onto timesteps it
# never saw during DMD distillation. Set t_sampling_mode: uniform + use
# t_min/t_max to test the broader-range variant.

# data
data_root: ${oc.env:LL_DATA}
category: Skateboarding
frame_count: 81
resolution: 480

# backbone — 1.3B CausalWanModel, weights loaded from base_ckpt.
# model_name / is_causal / local_attn_size / sink_size / timestep_shift match
# upstream configs/longlive_inference.yaml so the attention shape and noise
# schedule align with longlive_base.pt's training-time configuration.
model_name: Wan2.1-T2V-1.3B
timestep_shift: 5.0
is_causal: true
local_attn_size: 12
sink_size: 3
base_ckpt: ${oc.env:LL_DATA}/longlive_models/models/longlive_base.pt

# NVlabs baseline LoRA (lora.pt) — overlaid + merged into base before our
# LoRA is attached. Frozen starting point = base + this LoRA = NVlabs
# inference product. rank/alpha must match what NVlabs trained lora.pt with.
baseline_lora_ckpt: ${oc.env:LL_DATA}/longlive_models/models/lora.pt
baseline_adapter:
  type: lora
  rank: 256
  alpha: 256
  dropout: 0.0
  verbose: false

# Our LoRA (trained with MotionDirector loss)
adapter:
  type: lora
  rank: 256
  alpha: 256
  dropout: 0.0
  verbose: true

# training
train_steps: 500
lr: 5.0e-5
weight_decay: 0.0
warmup_steps: 50
null_prompt_p: 0.1

# Timestep sampling
t_sampling_mode: anchor_only
t_anchors: [1000, 750, 500, 250]
t_min: 20      # used when t_sampling_mode == "uniform"
t_max: 980     # used when t_sampling_mode == "uniform"

# loss (MotionDirector paper recipe)
ad_alpha: 1.4142135623730951
ad_beta: 1.0

# logging / ckpt
out_dir: ${oc.env:LL_DATA}/motiondirector_runs/skateboarding_fewstep
ckpt_interval: 100
ckpt_keep_last: 5

# misc
seed: 0
